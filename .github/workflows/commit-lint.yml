---
name: Commit Lint

# Org-wide commit-message, PR-title, and branch-naming policy, promoted from
# z-shell/zi's next-branch-only commit-lint.yml (z-shell/.github#464). Enforces
# the AGENTS.md rules that were previously "author-enforced" only: the
# disallowed bot/AI-agent Co-authored-by trailer -- a human co-author is
# allowed, only a bot/agent identity is banned (AGENTS.md) -- Conventional
# Commits (decisions/0003), and issue-linked topic-branch naming
# (decisions/0019).
#
# This workflow triggers directly on pull_request and is also callable by other
# repositories. It was previously reached only through a thin `lint-commits.yml`
# caller whose workflow-level `permissions: {}` capped the nested jobs at no
# permissions, so every run ended in startup_failure and the policy was never
# evaluated (z-shell/.github#575). The self-triggering + `workflow_call` shape
# matches the other reusable suites in this repository.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  workflow_call:
    inputs:
      disallowed-trailer-pattern:
        description: >
          Case-insensitive grep -E pattern for a banned commit trailer. A
          Co-authored-by trailer crediting a real human is allowed; only a
          bot/AI-agent/automation identity is disallowed (AGENTS.md), so the
          fallback matches known bot/agent trailer shapes rather than every
          Co-authored-by line. Extend as new agent identities show up. The
          fallback lives in the job step, because workflow_call input defaults
          do not apply to a pull_request run.
        required: false
        type: string
      branch-pattern:
        description: >
          grep -E pattern a PR head branch must match. Agent- and
          bot-generated prefixes (dependabot/, renovate/, copilot/, codex/) are
          always allowed, because the pull-request author does not choose those
          names. next is allowed only for z-shell/zi. Falls back to
          ^(feature|bug|hotfix)-[1-9][0-9]*(-[a-z0-9]+)*$ in the job step, which
          keeps the issue id mandatory and permits a descriptive slug after it
          (decisions/0019).
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Branch names a coding agent or bot chooses, not the pull-request author.
# Shared by Validate Branch Name and Validate Issue Link, which must agree.
# Workflow-level env is exported into every step, so both read one definition.
env:
  AUTOMATION_BRANCH_PATTERN: "^(dependabot|renovate|copilot|codex)/"

jobs:
  commit-message:
    name: Validate Commits
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 📝 Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISALLOWED_TRAILER_PATTERN: ${{ inputs.disallowed-trailer-pattern }}
        run: |
          set -euo pipefail

          # workflow_call input defaults are not applied on a pull_request run,
          # so an unset or empty pattern would otherwise match every line.
          : "${DISALLOWED_TRAILER_PATTERN:=^[[:space:]]*Co-authored-by:.*(\[bot\]|noreply@anthropic\.com|noreply@openai\.com|noreply@x\.ai|codex@openai\.com|copilot@github\.com|claude@anthropic\.com)}"

          CONVENTIONAL_PATTERN='^(feat|fix|perf|refactor|docs|test|build|ci|style|chore|revert)(\([^)]+\))?!?: .{1,72}$'

          errors=0
          checked=0

          while IFS= read -r sha; do
            # grep -c, not grep -q. Under pipefail, grep -q exits on its first
            # match while git is still writing, git takes SIGPIPE and returns
            # 141, and the pipeline result turns a real match into a miss for
            # any message larger than the pipe buffer. grep -c reads to the end,
            # so the writer always finishes (z-shell/.github#587).
            if [ "$(git show -s --format='%B' "$sha" | grep -ciE "$DISALLOWED_TRAILER_PATTERN")" -gt 0 ]; then
              echo "::error::Bot/agent Co-authored-by trailer found (${sha:0:7}): remove before merging. A human co-author is fine; only bot/AI-agent identities are banned (AGENTS.md). A squash merge without an explicit --subject/--body can also reintroduce one — see runbooks/branch-protection.md."
              errors=$((errors + 1))
            fi

            parent_count=$(git cat-file -p "$sha" | grep -c '^parent' || true)
            [ "$parent_count" -gt 1 ] && continue

            subject=$(git show -s --format='%s' "$sha")
            checked=$((checked + 1))

            if ! echo "$subject" | grep -qE "$CONVENTIONAL_PATTERN"; then
              echo "::error::Invalid commit message (${sha:0:7}): expected type(scope): description <=72 chars"
              errors=$((errors + 1))
            fi
          done < <(git log --format='%H' "${BASE_SHA}..${HEAD_SHA}")

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors commit(s) failed validation — run: git rebase -i ${BASE_SHA}"
            exit 1
          fi

          echo "✅ $checked commit(s) validated"

  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 📋 Check PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|perf|refactor|docs|test|build|ci|style|chore|revert)(\([^)]+\))?!?: .{1,72}$'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title must follow Conventional Commits: type(scope): description"
            exit 1
          fi
          echo "✅ PR title valid"

  branch-naming:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 🌿 Check branch naming convention
        env:
          BRANCH: ${{ github.head_ref }}
          BRANCH_PATTERN: ${{ inputs.branch-pattern }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # As above: an empty pattern would match every branch name and turn
          # this job into a silent pass.
          # decisions/0022: a shape check, not an identifier check.
          # Traceability moved to Validate Issue Link. Either
          # <type>-<id> with an optional slug, which stays the
          # recommended form, or <type>/<slug> over the
          # decisions/0003 Conventional Commits types plus
          # feature, bug and hotfix.
          : "${BRANCH_PATTERN:=^((feature|bug|hotfix)-[1-9][0-9]*(-[a-z0-9]+)*|(feat|fix|perf|refactor|docs|test|build|ci|style|chore|revert|feature|bug|hotfix)/[a-z0-9]+(-[a-z0-9]+)*)$}"

          if echo "$BRANCH" | grep -qE "$AUTOMATION_BRANCH_PATTERN" || \
             { [ "$REPOSITORY" = "z-shell/zi" ] && [ "$BRANCH" = "next" ]; }; then
            echo "✅ OK"
            exit 0
          fi
          if ! echo "$BRANCH" | grep -qE "$BRANCH_PATTERN"; then
            echo "::error::Branch name must match ${BRANCH_PATTERN} (see decisions/0019-trunk-on-main-default.md)"
            exit 1
          fi
          echo "✅ Branch name valid"

  issue-link:
    name: Validate Issue Link
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 🔗 Check the pull request is traceable to an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BRANCH: ${{ github.head_ref }}
          EXEMPT_LABEL: meta:no-issue
        run: |
          set -euo pipefail

          # decisions/0022-issue-traceability-on-pull-requests.md moves
          # traceability off the branch name and onto the pull request. Three
          # outcomes pass, and the job says which applied, so an exemption is
          # visible in review rather than silent.
          #
          # Everything here comes from the pull_request event payload, so the
          # job needs no token and no permissions.

          if printf '%s\n' "$BRANCH" | grep -qE "$AUTOMATION_BRANCH_PATTERN"; then
            echo "✅ Exempt: $BRANCH is an automation branch"
            exit 0
          fi

          if printf '%s\n' "$PR_LABELS" | tr ',' '\n' | grep -qxF "$EXEMPT_LABEL"; then
            echo "✅ Exempt: labelled $EXEMPT_LABEL"
            exit 0
          fi

          # A bare #123, or a full issue or pull-request URL. Either a closing
          # keyword or a plain reference satisfies ADR-0022; both land in the
          # body, so no API call is needed.
          # Three accepted forms: a bare #123, the cross-repository
          # owner/repo#123 shorthand, and a full issue or pull-request URL.
          ISSUE_REFERENCE_PATTERN='(^|[^A-Za-z0-9_])#[1-9][0-9]*([^0-9]|$)|[A-Za-z0-9._-]+/[A-Za-z0-9._-]+#[1-9][0-9]*|https://github\.com/[^/ ]+/[^/ ]+/(issues|pull)/[1-9][0-9]*'

          if printf '%s\n' "${PR_BODY:-}" | grep -qE "$ISSUE_REFERENCE_PATTERN"; then
            echo "✅ The pull request references an issue"
            exit 0
          fi

          echo "::error::No issue reference found. Link the owning issue in the pull-request body (Closes #123, or a plain #123 for work an issue tracks but this does not close). If this pull request genuinely has no owning issue, such as gitlink reconciliation or a routine dependency update, a maintainer applies the ${EXEMPT_LABEL} label (decisions/0022-issue-traceability-on-pull-requests.md)."
          exit 1
