---
name: Community Health Audit
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "automation/governance/repo-settings-audit.rb"
      - "knowledge/domains/governance/data/template-exceptions.yml"
      - ".github/workflows/community-health-audit.yml"

# Report-only audit of shadow community health files (#720). It reads public
# repository trees with the workflow token and fails only on community health
# drift or a failed read of those trees: --skip-settings keeps rulesets, branch
# protection and settings out of the run. It is not a required status check.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-health-audit:
    name: Community Health Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: "⤵️ Check out code from GitHub"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: "🔎 Audit public non-fork repositories"
        run: |
          set -o pipefail
          ruby automation/governance/repo-settings-audit.rb --all-repos \
            --community-health --skip-settings --fail-on-drift | tee -a "$GITHUB_STEP_SUMMARY"

      # --all-repos leaves out forks, so each public fork is named here.
      - name: "🔎 Audit public forks"
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ruby automation/governance/repo-settings-audit.rb \
            --repo z-shell/merch \
            --repo z-shell/z-a-eval \
            --repo z-shell/z-a-linkbin \
            --repo z-shell/zsh-web-artwork \
            --repo z-shell/zunit \
            --community-health --skip-settings --fail-on-drift | tee -a "$GITHUB_STEP_SUMMARY"
