name: Zsh Lint Tests

on:
  push:
    branches: [main]
    paths:
      - scripts/zsh_lint_ci.py
      - scripts/test_zsh_lint_ci.py
      - scripts/fixtures/zsh-lint/**
      - .github/workflows/zsh-lint*.yml
  pull_request:
    paths:
      - scripts/zsh_lint_ci.py
      - scripts/test_zsh_lint_ci.py
      - scripts/fixtures/zsh-lint/**
      - .github/workflows/zsh-lint*.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    name: Lint Integration Behavior
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test lint integration
        run: python3 -m unittest scripts/test_zsh_lint_ci.py -v
  released-analyzer:
    name: Released Analyzer Contract
    uses: ./.github/workflows/zsh-lint.yml
    with:
      paths: scripts/fixtures/zsh-lint/clean.txt
      zsh-lint-ref: 999cb76cc65ef6af56c0ae65ab0f3622eb527944 # v1.3.0
