name: Zsh Lint Tests

on:
  push:
    branches: [main]
    paths:
      - automation/ci/zsh_lint_ci.py
      - automation/ci/test_zsh_lint_ci.py
      - automation/ci/fixtures/zsh-lint/**
      - .github/workflows/zsh-lint*.yml
  pull_request:
    paths:
      - automation/ci/zsh_lint_ci.py
      - automation/ci/test_zsh_lint_ci.py
      - automation/ci/fixtures/zsh-lint/**
      - .github/workflows/zsh-lint*.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    name: Lint Integration Behavior
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test lint integration
        run: python3 -m unittest automation/ci/test_zsh_lint_ci.py -v
  released-analyzer:
    name: Released Analyzer Contract
    uses: ./.github/workflows/zsh-lint.yml
    with:
      paths: automation/ci/fixtures/zsh-lint/clean.txt
      zsh-lint-ref: aff60185cddb4b829f39f2db82aae9fc7bce3e7d # v1.4.0
