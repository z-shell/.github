name: Agent Instruction Validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "PATTERNS.md"
      - "knowledge/**"
      - "automation/knowledge/knowledge-delivery.py"
      - "automation/knowledge/test_knowledge_delivery.py"
      - "automation/knowledge/knowledge-coverage.py"
      - "automation/knowledge/test_knowledge_coverage.py"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".claude/**"
      - ".gemini/**"
      - ".github/AGENT_MEMORY.md"
      - ".github/README.md"
      - ".github/copilot-instructions.md"
      - ".github/instruction-surfaces.json"
      - ".github/agents/**"
      - ".github/instructions/**"
      - ".github/skills/**"
      - "**/AGENTS.md"
      - "**/AGENTS.override.md"
      - ".github/workflows/agent-instructions.yml"
      - "decisions/**"
      - "runbooks/**"
      - "knowledge/domains/zsh/data/zsh-standard-policy.json"
      - "knowledge/domains/agents/data/approved-skills.json"
      - "automation/agents/org-routing.py"
      - "automation/agents/test_org_routing.py"
      - "automation/agents/org_policy_report.py"
      - "automation/agents/test_org_policy_report.py"
      - "automation/agents/validate-agent-policy.py"
      - "automation/agents/test_validate_agent_policy.py"
      - "automation/ci/validate-zsh-standard-policy.py"
      - "automation/ci/test_validate_zsh_standard_policy.py"
      - "automation/governance/decision-records.py"
      - "automation/governance/test_decision_records.py"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "PATTERNS.md"
      - "knowledge/**"
      - "automation/knowledge/knowledge-delivery.py"
      - "automation/knowledge/test_knowledge_delivery.py"
      - "automation/knowledge/knowledge-coverage.py"
      - "automation/knowledge/test_knowledge_coverage.py"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".claude/**"
      - ".gemini/**"
      - ".github/AGENT_MEMORY.md"
      - ".github/README.md"
      - ".github/copilot-instructions.md"
      - ".github/instruction-surfaces.json"
      - ".github/agents/**"
      - ".github/instructions/**"
      - ".github/skills/**"
      - "**/AGENTS.md"
      - "**/AGENTS.override.md"
      - ".github/workflows/agent-instructions.yml"
      - "decisions/**"
      - "runbooks/**"
      - "knowledge/domains/zsh/data/zsh-standard-policy.json"
      - "knowledge/domains/agents/data/approved-skills.json"
      - "automation/agents/org-routing.py"
      - "automation/agents/test_org_routing.py"
      - "automation/agents/org_policy_report.py"
      - "automation/agents/test_org_policy_report.py"
      - "automation/agents/validate-agent-policy.py"
      - "automation/agents/test_validate_agent_policy.py"
      - "automation/ci/validate-zsh-standard-policy.py"
      - "automation/ci/test_validate_zsh_standard_policy.py"
      - "automation/governance/decision-records.py"
      - "automation/governance/test_decision_records.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Agent Instructions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Set up Zsh
        uses: ./actions/setup-zsh

      - name: Run agent policy unit tests
        run: python3 -m unittest automation/agents/test_validate_agent_policy.py -v

      - name: Check central knowledge delivery
        run: python3 automation/knowledge/knowledge-delivery.py --check

      - name: Run knowledge delivery unit tests
        run: python3 -m unittest automation/knowledge/test_knowledge_delivery.py -v

      - name: Check repository knowledge coverage
        run: python3 automation/knowledge/knowledge-coverage.py

      - name: Run knowledge coverage unit tests
        run: python3 -m unittest automation/knowledge/test_knowledge_coverage.py -v

      - name: Run routing generator unit tests
        run: python3 -m unittest automation/agents/test_org_routing.py automation/agents/test_org_policy_report.py -v

      - name: Run decision record unit tests
        run: python3 -m unittest automation/governance/test_decision_records.py -v

      - name: Run Zsh standard policy unit tests
        run: python3 -m unittest automation/ci/test_validate_zsh_standard_policy.py -v

      - name: Validate Zsh standard policy
        run: python3 automation/ci/validate-zsh-standard-policy.py

      - name: Validate agent policy
        run: python3 automation/agents/validate-agent-policy.py

      - name: Validate decision records and index
        run: python3 automation/governance/decision-records.py --check
