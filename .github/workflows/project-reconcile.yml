name: Project Reconcile

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply project membership changes after reviewing the report
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: project-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile Project 28
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reconciliation source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Reconcile organization issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply || false }}
          ORGANIZATION: z-shell
          PROJECT_NUMBER: '28'
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo 'PROJECT_TOKEN is not configured; refusing to run without a project-scoped credential.' >&2
            exit 1
          fi

          project_id="$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) { id }
              }
            }' -f org="${ORGANIZATION}" -F number="${PROJECT_NUMBER}" --jq '.data.organization.projectV2.id')"

          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/search/issues?q=org%3A${ORGANIZATION}%20is%3Aissue%20is%3Aopen&per_page=100" \
            --jq '.items[] | {url: .html_url, node_id: .node_id, title: .title, repository: .repository_url, author: .user.login, updated_at: .updated_at, labels: [.labels[].name]}' \
            > open-issues.ndjson

          : > project-items.ndjson
          cursor=''
          while :; do
            response="$(gh api graphql -f query='
              query($project: ID!, $cursor: String) {
                node(id: $project) {
                  ... on ProjectV2 {
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on Issue { url id title repository { nameWithOwner } }
                          ... on PullRequest { url id title repository { nameWithOwner } }
                        }
                      }
                    }
                  }
                }
              }' -f project="${project_id}" -f cursor="${cursor}")"
            jq -c '.data.node.items.nodes[] | select(.content != null) | {item_id: .id, url: .content.url, node_id: .content.id, title: .content.title, repository: .content.repository.nameWithOwner}' <<<"${response}" >> project-items.ndjson
            if [[ "$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"${response}")" != 'true' ]]; then
              break
            fi
            cursor="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"${response}")"
          done

          python3 scripts/project_reconcile.py \
            --open-issues open-issues.ndjson \
            --project-items project-items.ndjson \
            --output project-reconcile-report.json \
            --stale-after-days 5

          if [[ "${APPLY}" != 'true' ]]; then
            echo 'Dry run only; no project mutations requested.'
            exit 0
          fi

          while IFS= read -r issue; do
            node_id="$(jq -r '.node_id' <<<"${issue}")"
            gh api graphql -f query='
              mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                  item { id }
                }
              }' -f project="${project_id}" -f content="${node_id}" >/dev/null
          done < <(jq -c '.missing_open_issues[]' project-reconcile-report.json)

          echo 'Project membership reconciliation applied.'

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: project-reconcile-report
          path: |
            open-issues.ndjson
            project-items.ndjson
            project-reconcile-report.json
          if-no-files-found: warn
