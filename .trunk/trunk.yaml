version: 0.1
cli:
  version: 1.25.0
merge:
  required_statuses:
    - Trunk Check
repo:
  repo:
    host: github.com
    owner: z-shell
    name: .github
plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.11.0
lint:
  definitions:
    # This repository is consumed as a submodule, so `.git` is a file whose
    # gitdir is relative to the superproject. Trunk's sandbox copy breaks that
    # relative path, so anchor the command at the real workspace.
    - name: git-diff-check
      commands:
        - name: lint
          run: git -C "${workspace}" diff --check ${target}
  disabled:
    - terrascan
    - trivy
    - checkov
    - trufflehog
    - yamllint
    - vale
  enabled:
    - oxipng@10.1.0
    - bandit@1.9.4
    - ruff@0.15.11
    - taplo@0.10.0
    - isort@8.0.1
    - flake8@7.3.0
    - black@26.3.1
    - svgo@4.0.1
    - git-diff-check@SYSTEM
    - hadolint@2.14.0
    - actionlint@1.7.12
    - gitleaks@8.30.1
    - markdownlint@0.48.0
    - prettier@3.8.3
    - shfmt@3.6.0
    - shellcheck@0.11.0
  ignore:
    - linters: [svgo]
      paths:
        - "metrics/**"
    - linters: [markdownlint]
      paths:
        - ".github/styles/**"
runtimes:
  enabled:
    - python@3.10.8
    - go@1.25.13
    - node@22.16.0
  definitions:
    - type: go
      linter_environment:
        - name: PATH
          list: ["${linter}/bin"]
        - name: GOPATH
          value: ${linter}
        - name: GOBIN
          value: ${linter}/bin
actions:
  disabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - git-blame-ignore-revs
    - trunk-upgrade-available
    - trunk-cache-prune
    - trunk-announce
