# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
# Usage and limits: https://github.com/z-shell/.github/blob/main/.github/instructions/ci/workflow-contract.instructions.md#pinact-exception-for-organization-reusable-workflows
version: 3
ignore_actions:
  # Organization reusable workflows are referenced at @main (ADR-0042).
  # pinact skips validation and updates for these entries; both patterns must
  # match the whole name and ref. Merge into an existing config; keep unrelated
  # settings and checks enabled.
  - name: z-shell/\.github/\.github/workflows/.*
    ref: main
  # Existing full-SHA pins with the earlier interim # main comment. The ref
  # regex checks SHA shape only; verify the workflow and commit separately.
  - name: z-shell/\.github/\.github/workflows/.*
    ref: "[0-9a-f]{40}"
