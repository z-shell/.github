# Approved repository-local community health files (z-shell/.github#720).
#
# GitHub applies the community health files in z-shell/.github to every
# repository that has no file of its own. A repository listed here keeps the
# named local files because they collect intake fields the organization forms
# cannot express. Every other local issue form, pull-request template,
# contribution, security, conduct, support or funding file, and any
# .github/copilot-instructions.md adapter, is drift.
#
# Read by automation/governance/repo-settings-audit.rb --community-health:
#   - exceptions: path, the approved blob id at the repository's default
#     branch, and the reason. A changed blob or a missing file is drift.
#   - vendor_org_forms: one local issue form hides the whole organization
#     issue-template folder, so the repository carries the organization forms
#     as vendored copies. A copy must match the organization blob at the same
#     path; a differing copy is drift.
version: 1
repositories:
  z-shell/F-Sy-H:
    exceptions:
      - path: .github/ISSUE_TEMPLATE/01_bug_report.yml
        blob: 434728851e5021e1c9b6046b7af501a23b5742da
        reason: The plugin bug report asks for a summary, a minimal reproduction and the actual behavior, and applies the area:plugin label; the organization bug report has none of these.
      - path: .github/ISSUE_TEMPLATE/02_feature_request.yml
        blob: f004e5185ac38290d2e5d66ea0d05c1ce80fdfda
        reason: The plugin feature request asks for the problem or use case, the proposed behavior, the alternatives considered and the compatibility considerations, and applies the area:plugin label.
      - path: .github/ISSUE_TEMPLATE/04_documentation.yml
        blob: 491aa8086f612f7711d0b2e217b4ad1f2d754c25
        reason: The documentation form asks for the documentation location, the problem and the suggested change, which the organization documentation form does not ask for.
      - path: .github/ISSUE_TEMPLATE/config.yml
        blob: fa9e7de4bb29fe0610ff4b5b002c9a94aa29357c
        reason: The local forms hide the organization folder, so the repository keeps its own contact links, including a private security report through its advisories.
      - path: .github/PULL_REQUEST_TEMPLATE.md
        blob: 64e345515e694798a3fc1998a6fd541bfad4608c
        reason: The plugin pull-request template asks for the compatibility and lifecycle impact of a change (entrypoint, supported Zsh versions, plugin manager compatibility, hooks, widgets and unload behavior), a section the organization template does not have.
  z-shell/wiki:
    vendor_org_forms: true
    exceptions:
      - path: .github/ISSUE_TEMPLATE/01_request_documentation.yml
        blob: 63efae7d592a58da12bbb28019794d388ea7ed53
        reason: Wiki documentation requests ask which locale the issue concerns, a field the organization documentation form does not have.
  z-shell/zi:
    vendor_org_forms: true
    exceptions:
      - path: .github/PULL_REQUEST_TEMPLATE/promotion.md
        blob: eec969d68b7915633ff49ca7bca6605a63eb764d
        reason: The next-to-main promotion pull request (ADR-0019) records the candidate identity, required validation, readiness review, merge contract and rollback readiness.
  z-shell/zsh-lint:
    vendor_org_forms: true
    exceptions:
      - path: .github/ISSUE_TEMPLATE/parser-gap.yml
        blob: e9b4dadce312ad227a108d993ba40a2960ab70e8
        reason: Parser gaps follow docs/project/parser-gap-workflow.md and need the minimized script, its `zsh -f -n` result, the zsh-lint output and the Zsh manual section.
      - path: .github/ISSUE_TEMPLATE/rule-proposal.yml
        blob: d97ecee53df82b2083f0edc2d5cfc36e7da7ab21
        reason: Rule proposals follow docs/project/rule-policy.md and need the rule ID and name, corpus evidence, bad and good examples and the proposed severity.
