---
name: "Setup Zsh"
description: "Setup Zsh for GitHub Actions"
inputs:
  version:
    description: "Package version (latest), or exact Linux source version (5.9, 5.9.2)"
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Set up Zsh
      shell: bash
      env:
        ZSH_VERSION: ${{ inputs.version }}
        SETUP_ZSH_ACTION_PATH: ${{ github.action_path }}
      run: bash "$SETUP_ZSH_ACTION_PATH/install.sh"
